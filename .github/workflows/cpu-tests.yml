name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      MAPSY_DISABLE_GPU: "1"
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install MapSy
        run: python -m pip install .
      - name: Check installed metadata and command-line entry point
        run: |
          python -c "import importlib.metadata, mapsy; assert importlib.metadata.version('mapsy') == mapsy.__version__ == '0.1.0'"
          mapsy version
          python -m pip check
      - name: Run package tests
        run: python -m unittest discover -s tests -v
      - name: Run example tests
        run: python -m unittest discover -s examples/tests -v
