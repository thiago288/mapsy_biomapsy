[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapsy"
version = "0.1.0"
description = "Local-environment descriptor mapping for periodic and aperiodic surfaces"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [
    {name = "MATERIALab"},
    {name = "Thiago"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "ase",
    "scikit-learn",
    "pydantic>=1.10.17,<3",
    "typing-extensions>=4",
    "joblib",
    "matplotlib",
    "click",
    "PyYAML",
]

[project.optional-dependencies]
notebooks = ["nbformat", "nbclient", "ipykernel"]
extended = [
    "nbformat",
    "nbclient",
    "ipykernel",
    "biopython",
    "plotly",
    "networkx",
    "umap-learn",
    "hdbscan",
    "pyarrow",
]

[project.scripts]
mapsy = "mapsy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
